<div class="login-page-container">

  <div class="card login-card border-0 shadow-lg rounded-4 overflow-hidden">

    <div class="card-body p-4 p-sm-5">

     

      <!-- Header Section -->

      <div class="text-center mb-4">

        <div class="login-icon-box mx-auto mb-3 bg-light rounded-circle d-flex align-items-center justify-content-center shadow-sm">

          <i class="fa-solid fa-lock text-orange fs-4"></i>

        </div>

        <h3 class="fw-bold text-navy mb-1">Welcome Back</h3>

        <p class="text-slate text-xs mb-0">Enter your credentials to access your portal</p>

      </div>



      <!-- Form Start -->

      <form [formGroup]="loginForm" (ngSubmit)="handelFormLogin()">

       

        <!-- API Error Alert -->

        <div class="alert alert-danger d-flex align-items-center gap-2 border-0 bg-danger-subtle text-danger text-xs p-3 rounded-3 mb-3" *ngIf="msgError">

          <i class="fa-solid fa-triangle-exclamation"></i>

          <span class="mb-0">{{ msgError }}</span>

        </div>



        <!-- Email Field -->

        <div class="mb-3">

          <label for="email" class="form-label fw-semibold text-xs text-slate mb-1">Email Address</label>

          <div class="input-group">

            <span class="input-group-text bg-light border-light-subtle text-slate border-end-0 px-3">

              <i class="fa-regular fa-envelope"></i>

            </span>

            <input

              type="text"

              formControlName="email"

              id="email"

              class="form-control text-xs py-2.5 bg-light border-light-subtle rounded-end-3"

              placeholder="name@company.com"

            >

          </div>

         

          <div class="text-danger text-xxs mt-1 ps-1" *ngIf="loginForm.get('email')?.errors && loginForm.get('email')?.touched">

            <span *ngIf="loginForm.get('email')?.getError('required')">

              <i class="fa-solid fa-circle-xmark me-1"></i>Email is required

            </span>

            <span *ngIf="loginForm.get('email')?.getError('email')">

              <i class="fa-solid fa-circle-xmark me-1"></i>Email format is invalid

            </span>

          </div>

        </div>



        <!-- Password Field -->

        <div class="mb-4">

          <label for="password" class="form-label fw-semibold text-xs text-slate mb-1">Password</label>

          <div class="input-group">

            <span class="input-group-text bg-light border-light-subtle text-slate border-end-0 px-3">

              <i class="fa-solid fa-key"></i>

            </span>

            <input

              type="password"

              formControlName="password"

              id="password"

              class="form-control text-xs py-2.5 bg-light border-light-subtle rounded-end-3"

              placeholder="••••••••"

            >

          </div>

         

          <div class="text-danger text-xxs mt-1 ps-1" *ngIf="loginForm.get('password')?.errors && loginForm.get('password')?.touched">

            <span *ngIf="loginForm.get('password')?.getError('required')">

              <i class="fa-solid fa-circle-xmark me-1"></i>Password is required

            </span>

          </div>

        </div>



        <!-- Submit Button -->

        <button [disabled]="loginForm.invalid || isLoading" type="submit" class="btn btn-orange-main w-100 py-2.5 rounded-3 text-xs fw-semibold d-flex align-items-center justify-content-center gap-2">

          <i *ngIf="isLoading" class="fas fa-spinner fa-spin"></i>

          <span>{{ isLoading ? 'Signing In...' : 'Sign In' }}</span>

        </button>



      </form>

      <!-- Demo Credentials Box -->
<div class="demo-box mt-4 p-3.5 bg-light rounded-4 border">
  
  <!-- Header Title & Badge -->
  <div class="d-flex align-items-center justify-content-between mb-3 px-1">
    <span class="badge bg-orange-subtle text-orange fw-bold px-2.5 py-1.5 rounded-2">
      <i class="fa-solid fa-vial me-1.5"></i> Demo Accounts
    </span>
    <small class="text-muted" style="font-size: 11px;">Click icon to copy</small>
  </div>

  <!-- Admin Account -->
  <div class="account-card p-3 rounded-3 border bg-white mb-2.5 shadow-sm">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <span class="fw-bold text-dark extra-small">
        <i class="fa-solid fa-user-shield text-orange me-1.5"></i> Admin Account
      </span>
    </div>
    
    <div class="d-flex justify-content-between align-items-center mb-2">
      <span class="text-secondary extra-small text-truncate me-2">
        Email: <code class="text-dark">admin@hrms.com</code>
      </span>
      <button type="button" class="btn btn-sm btn-light border-0 rounded-2 p-1.5 copy-btn" (click)="copyToClipboard('admin@hrms.com', 'Admin Email', $event)" title="Copy Email">
        <i class="fa-regular fa-copy"></i>
      </button>
    </div>

    <div class="d-flex justify-content-between align-items-center">
      <span class="text-secondary extra-small">
        Pass: <code class="text-dark">Admin123!</code>
      </span>
      <button type="button" class="btn btn-sm btn-light border-0 rounded-2 p-1.5 copy-btn" (click)="copyToClipboard('Admin123!', 'Admin Password', $event)" title="Copy Password">
        <i class="fa-regular fa-copy"></i>
      </button>
    </div>
  </div>

  <!-- Employee Account -->
  <div class="account-card p-3 rounded-3 border bg-white shadow-sm">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <span class="fw-bold text-dark extra-small">
        <i class="fa-solid fa-user-tie text-info me-1.5"></i> Employee Account
      </span>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-2">
      <span class="text-secondary extra-small text-truncate me-2">
        Email: <code class="text-dark">emp@hrms.com</code>
      </span>
      <button type="button" class="btn btn-sm btn-light border-0 rounded-2 p-1.5 copy-btn" (click)="copyToClipboard('emp@hrms.com', 'Employee Email', $event)" title="Copy Email">
        <i class="fa-regular fa-copy"></i>
      </button>
    </div>

    <div class="d-flex justify-content-between align-items-center">
      <span class="text-secondary extra-small">
        Pass: <code class="text-dark">Emp123!</code>
      </span>
      <button type="button" class="btn btn-sm btn-light border-0 rounded-2 p-1.5 copy-btn" (click)="copyToClipboard('Emp123!', 'Employee Password', $event)" title="Copy Password">
        <i class="fa-regular fa-copy"></i>
      </button>
    </div>
  </div>

</div>

    </div>

  </div>
