<div class="login-page-container d-flex align-items-center justify-content-center min-vh-100 bg-light py-5">
  <div class="card login-card border-0 shadow-lg rounded-4 overflow-hidden" style="max-width: 440px; width: 100%;">
    <div class="card-body p-4 p-sm-5">
      
      <!-- Header Section -->
      <div class="text-center mb-4">
        <div class="login-icon-box mx-auto mb-3 bg-light rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 60px; height: 60px;">
          <i class="fa-solid fa-lock text-warning fs-4"></i>
        </div>
        <h3 class="fw-bold text-dark mb-1">Welcome Back</h3>
        <p class="text-muted small mb-0">Enter your credentials to access your portal</p>
      </div>

      <!-- Form Start -->
      <form [formGroup]="loginForm" (ngSubmit)="handelFormLogin()">
        
        <!-- API Error Alert -->
        <div class="alert alert-danger d-flex align-items-center gap-2 border-0 bg-danger-subtle text-danger small p-3 rounded-3 mb-3" *ngIf="msgError">
          <i class="fa-solid fa-triangle-exclamation"></i>
          <span class="mb-0">{{ msgError }}</span>
        </div>

        <!-- Email Field -->
        <div class="mb-3">
          <label for="email" class="form-label fw-semibold small text-secondary mb-1">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 px-3">
              <i class="fa-regular fa-envelope text-muted"></i>
            </span>
            <input 
              type="text" 
              formControlName="email" 
              id="email" 
              class="form-control bg-light border-start-0 py-2" 
              placeholder="name@company.com"
            >
          </div>
          
          <div class="text-danger small mt-1" *ngIf="loginForm.get('email')?.errors && loginForm.get('email')?.touched">
            <span *ngIf="loginForm.get('email')?.getError('required')">
              <i class="fa-solid fa-circle-xmark me-1"></i>Email is required
            </span>
            <span *ngIf="loginForm.get('email')?.getError('email')">
              <i class="fa-solid fa-circle-xmark me-1"></i>Email format is invalid
            </span>
          </div>
        </div>

        <!-- Password Field -->
        <div class="mb-4">
          <label for="password" class="form-label fw-semibold small text-secondary mb-1">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 px-3">
              <i class="fa-solid fa-key text-muted"></i>
            </span>
            <input 
              type="password" 
              formControlName="password" 
              id="password" 
              class="form-control bg-light border-start-0 py-2" 
              placeholder="••••••••"
            >
          </div>
          
          <div class="text-danger small mt-1" *ngIf="loginForm.get('password')?.errors && loginForm.get('password')?.touched">
            <span *ngIf="loginForm.get('password')?.getError('required')">
              <i class="fa-solid fa-circle-xmark me-1"></i>Password is required
            </span>
          </div>
        </div>

        <!-- Submit Button -->
        <button [disabled]="loginForm.invalid || isLoading" type="submit" class="btn btn-warning text-white w-100 py-2.5 rounded-3 fw-semibold d-flex align-items-center justify-content-center gap-2 shadow-sm">
          <i *ngIf="isLoading" class="fas fa-spinner fa-spin"></i>
          <span>{{ isLoading ? 'Signing In...' : 'Sign In' }}</span>
        </button>

      </form>

      <!-- Demo Credentials Box -->
      <div class="demo-box mt-4 p-3 bg-light rounded-3 border">
        <div class="d-flex align-items-center justify-content-between mb-2">
          <span class="badge bg-warning text-dark fw-bold">Demo Accounts</span>
          <small class="text-muted" style="font-size: 11px;">Click icon to copy</small>
        </div>

        <!-- Admin Account -->
        <div class="account-item bg-white p-2 rounded-2 border mb-2">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <span class="fw-bold text-dark extra-small"><i class="fa-solid fa-user-shield text-warning me-1"></i> Admin Account</span>
          </div>
          <div class="d-flex justify-content-between align-items-center mb-1">
            <span class="text-secondary extra-small text-truncate me-2">Email: <code>admin@hrms.com</code></span>
            <button type="button" class="btn btn-link p-0 text-muted copy-btn" (click)="copyToClipboard('admin@hrms.com', $event)" title="Copy Email">
              <i class="fa-regular fa-copy"></i>
            </button>
          </div>
          <div class="d-flex justify-content-between align-items-center">
            <span class="text-secondary extra-small">Pass: <code>Admin123!</code></span>
            <button type="button" class="btn btn-link p-0 text-muted copy-btn" (click)="copyToClipboard('Admin123!', $event)" title="Copy Password">
              <i class="fa-regular fa-copy"></i>
            </button>
          </div>
        </div>

        <!-- Employee Account -->
        <div class="account-item bg-white p-2 rounded-2 border">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <span class="fw-bold text-dark extra-small"><i class="fa-solid fa-user-tie text-info me-1"></i> Employee Account</span>
          </div>
          <div class="d-flex justify-content-between align-items-center mb-1">
            <span class="text-secondary extra-small text-truncate me-2">Email: <code>emp@hrms.com</code></span>
            <button type="button" class="btn btn-link p-0 text-muted copy-btn" (click)="copyToClipboard('emp@hrms.com', $event)" title="Copy Email">
              <i class="fa-regular fa-copy"></i>
            </button>
          </div>
          <div class="d-flex justify-content-between align-items-center">
            <span class="text-secondary extra-small">Pass: <code>Emp123!</code></span>
            <button type="button" class="btn btn-link p-0 text-muted copy-btn" (click)="copyToClipboard('Emp123!', $event)" title="Copy Password">
              <i class="fa-regular fa-copy"></i>
            </button>
          </div>
        </div>

      </div>

    </div>
  </div>
</div>
