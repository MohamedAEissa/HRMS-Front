<section class="settings-wrapper py-4">
  <div class="container-fluid px-4">
    
    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between mb-4">
      <div>
        <h3 class="fw-bold text-dark mb-1">General Settings</h3>
        <p class="text-muted small mb-0">System overtime, deduction rates, and weekly days off.</p>
      </div>
    </div>

    <!-- Table Card -->
    <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table align-middle mb-0 custom-table">
            <thead class="bg-light">
              <tr>
                <th class="ps-4 py-3 text-secondary text-uppercase fs-7 fw-semibold">Overtime Rate</th>
                <th class="py-3 text-secondary text-uppercase fs-7 fw-semibold">Deduction Rate</th>
                <th class="py-3 text-secondary text-uppercase fs-7 fw-semibold">Weekly Day Off</th>
                <th class="text-end pe-4 py-3 text-secondary text-uppercase fs-7 fw-semibold">Action</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngIf="generalSettingData">
                <td class="ps-4 fw-bold text-dark">{{ generalSettingData.overtimeHourRate }} x</td>
                <td class="fw-bold text-dark">{{ generalSettingData.deductionHourRate }} x</td>
                <td>
                  <span class="badge bg-light text-primary border px-2 py-1">
                    {{ generalSettingData.weeklyDaysOff }}
                  </span>
                </td>
                <td class="text-end pe-4">
                  <button 
                    (click)="openEditModal()"
                    type="button" 
                    class="btn btn-sm btn-light border px-3 rounded-2 fw-semibold" 
                    data-bs-toggle="modal" 
                    data-bs-target="#settingModal"
                  >
                    <i class="fa-solid fa-pen text-secondary me-1"></i> Edit
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</section>

<!-- Edit Settings Modal -->
<div class="modal fade" id="settingModal" tabindex="-1" aria-labelledby="settingModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow rounded-4">
      
      <div class="modal-header border-bottom-0 pb-0">
        <h5 class="modal-title fw-bold text-dark" id="settingModalLabel">Update General Settings</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body p-4">
        <form [formGroup]="settingsForm" (ngSubmit)="updateGeneralSetting()">
          
          <!-- Overtime Hour Rate -->
          <div class="mb-3">
            <label for="overtime" class="form-label fw-semibold small text-secondary">Overtime Hour Rate</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-clock"></i></span>
              <input formControlName="overtimeHourRate" type="number" id="overtime" step="0.1" class="form-control" placeholder="e.g. 1.5">
            </div>
          </div>

          <!-- Deduction Hour Rate -->
          <div class="mb-3">
            <label for="deduction" class="form-label fw-semibold small text-secondary">Deduction Hour Rate</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-circle-minus"></i></span>
              <input formControlName="deductionHourRate" type="number" id="deduction" step="0.1" class="form-control" placeholder="e.g. 1.0">
            </div>
          </div>

          <!-- Weekly Day Off (Radio Buttons) -->
          <div class="mb-3">
            <label class="form-label fw-semibold small text-secondary d-block">Weekly Day Off</label>
            <div class="row g-2">
              <div class="col-6" *ngFor="let day of daysOfWeek">
                <div class="form-check p-2 border rounded-2">
                  <input 
                    formControlName="weeklyDaysOff" 
                    class="form-check-input ms-0 me-2" 
                    type="radio" 
                    [value]="day" 
                    [id]="'radio_' + day">
                  <label class="form-check-label small fw-semibold" [for]="'radio_' + day">{{ day }}</label>
                </div>
              </div>
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="d-flex justify-content-end gap-2 mt-4">
            <button type="button" class="btn btn-light rounded-3 px-3 fw-semibold" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" [disabled]="settingsForm.invalid || isLoading" class="btn btn-primary px-4 rounded-3 fw-semibold">
              <span *ngIf="!isLoading">Save Changes</span>
              <span *ngIf="isLoading"><i class="fa-solid fa-spinner fa-spin me-1"></i> Saving...</span>
            </button>
          </div>

        </form>
      </div>

    </div>
  </div>
</div>
