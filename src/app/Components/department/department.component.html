<div class="container-fluid px-4 px-lg-5 py-4">
  <!-- Header Section -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-bold mb-1 text-navy">Departments</h2>
      <p class="text-slate mb-0 small">Manage system departments and assign workforce structures.</p>
    </div>
    <!-- فتح الـ Modal عند الضغط -->
    <button (click)="openAddModal()" class="btn btn-orange-main px-3 py-2 rounded-3 text-xs fw-semibold d-flex align-items-center gap-2 shadow-sm" data-bs-toggle="modal" data-bs-target="#departmentModal">
  <i class="fa-solid fa-plus text-xs"></i>
  <span>Add Department</span>
</button>
  </div>

  <!-- Error Alert Section -->
  <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show rounded-3 shadow-sm mb-4" role="alert">
    <div class="d-flex align-items-center">
      <i class="fa-solid fa-circle-exclamation fs-5 me-2"></i>
      <div>{{ errorMessage }}</div>
    </div>
    <button type="button" class="btn-close" (click)="errorMessage = ''" aria-label="Close"></button>
  </div>

  <!-- Table Section -->
  <div class="card border border-light-subtle shadow-sm rounded-3 overflow-hidden">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="bg-light text-uppercase text-slate border-bottom">
          <tr>
            <th scope="col" class="py-3 ps-4 text-center" style="width: 5%;">#</th>
            <th scope="col" class="py-3">DEPARTMENT NAME</th>
            <th scope="col" class="py-3 text-end pe-4" style="width: 15%;">ACTIONS</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let dept of departmentsList; let i = index">
            <td class="ps-4 text-center fw-medium text-slate">{{ i + 1 }}</td>
            <td>
              <div class="d-flex align-items-center">
                <div class="icon-box me-3 rounded-2 d-flex align-items-center justify-content-center bg-orange-soft text-orange">
                  <i class="fa-solid fa-building"></i>
                </div>
                <span class="fw-semibold text-navy">{{ dept.name }}</span>
              </div>
            </td>
            <td class="text-end pe-4">
             <button (click)="openEditModal(dept)" class="btn btn-sm btn-light text-slate me-2 border-0 shadow-none hover-bg" title="Edit" data-bs-toggle="modal" data-bs-target="#departmentModal">
                <i class="fa-regular fa-pen-to-square"></i>
              </button>
              <button (click)="removeItem(dept.id)" class="btn btn-sm btn-light text-danger border-0 shadow-none hover-bg" title="Delete">
                <i class="fa-regular fa-trash-can"></i>
              </button>
            </td>
          </tr>

          <!-- Empty State -->
          <tr *ngIf="departmentsList.length == 0">
            <td colspan="3" class="text-center py-5 text-slate">
              <i class="fa-regular fa-folder-open d-block fs-2 mb-2"></i>
              No departments found.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal Create Department -->
<div class="modal fade" id="departmentModal" tabindex="-1" aria-labelledby="addDepartmentModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow rounded-3">
      <div class="modal-header border-bottom-0 pb-0">
        <h5 class="modal-title fw-bold text-navy" id="departmentModalLabel">{{isEditMode?'Edit Department':'Add New Department'}}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form [formGroup]="departmentForm" (ngSubmit)="saveDepartment()">
        <div class="modal-body py-4">
          <div class="mb-3">
            <label for="deptName" class="form-label fw-medium text-slate">Department Name</label>
            <input 
              type="text"
              id="deptName" 
              class="form-control rounded-2 py-2" 
              placeholder="e.g. Finance & Accounting" 
              formControlName="name"
            />
            <div *ngIf="departmentForm.get('name')?.invalid && departmentForm.get('name')?.touched" class="text-danger small mt-1">
              <span *ngIf="departmentForm.get('name')?.errors?.['required']">Department name is required.</span>
              <span *ngIf="departmentForm.get('name')?.errors?.['minlength']">Name must be at least 2 characters.</span>
            </div>
          </div>
        </div>
        <div class="modal-footer border-top-0 pt-0">
          <button type="button" class="btn btn-light px-4 rounded-3" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" [disabled]="departmentForm.invalid || isLoading" class="btn btn-orange-main px-4 rounded-3">
            <span *ngIf="!isLoading">{{isEditMode?'Update':'Save'}}</span>
            <span *ngIf="isLoading"><i class="fa-solid fa-spinner fa-spin"></i> Saving...</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
